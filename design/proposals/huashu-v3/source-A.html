<script>
'use strict';

uery||category||status);}
function resetFilters(){HTMLFormElement.prototype.reset.call(document.getElementById('filters'));render();}

function closeDialog(){if($('#feedbackDialog').open)$('#feedbackDialog').close();if(lastTrigger&&lastTrigger.isConnected)lastTrigger.focus();}
function closeKit(){if($('#kitDialog').open)$('#kitDialog').close();$('#previewKit').focus();}
function setMenu(open){$('#sidebar').classList.toggle('open',open);$('#drawerShade').classList.toggle('open',open);$('#menuToggle').setAttribute('aria-expanded',String(open));document.body.style.overflow=open?'hidden':'';if(open)$('#navigation a').focus();else $('#menuToggle').focus();}
buildNavigation();render();
$('#filters').addEventListener('submit',e=>{e.preventDefault();render();});$('#category').addEventListener('change',render);$('#status').addEventListener('change',render);$('#query').addEventListener('search',render);$('#reset').addEventListener('click',resetFilters);$('#clearEmpty').addEventListener('click',()=>{resetFilters();$('#query').focus();});
$('#refresh').addEventListener('click',()=>{render();toast('设计预览：已重新读取本地样例，未请求后台。');});$('#newActivity').addEventListener('click',e=>showDialog('新建活动 · 设计预览','新建活动入口已保留。本预览未连接后台，未创建任何活动。','preview',e.currentTarget));$('#logout').addEventListener('click',()=>toast('设计预览：退出登录入口已保留，当前未执行退出。'));
$('#navigation').addEventListener('click',e=>{const link=e.target.closest('a');if(!link)return;e.preventDefault();const route=link.dataset.route;if(window.innerWidth<1200)setMenu(false);if(route==='/activities'){resetFilters();toast('设计预览：当前为活动管理首页。');}else toast('设计预览：'+A_DESC[route]+'入口已保留（'+route+'），尚未连接后台。');});
$('#activityRows').addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;const x=A_DATA.find(row=>row.id===button.dataset.id);if(button.dataset.action==='edit')showDialog('编辑活动 · 设计预览','「'+x.title+'」的编辑入口已保留。本预览未修改活动内容。','preview',button);else if(x.priceCents>0)showDialog('收费订单 · 设计预览','「'+x.title+'」报名费 '+money(x.priceCents)+' / 人。正式后台通过此入口查看支付订单；本预览未连接订单服务。','preview',button);else showDialog('免费名单 · 设计预览','「'+x.title+'」为免费活动。正式后台通过此入口查看报名名单；本预览未读取用户资料。','preview',button);});
$('#previewPublish').addEventListener('click',e=>showDialog('发布这场活动？','发布后活动将出现在小程序，请再次确认报名价格、时间、地点和人数限制。','publish',e.currentTarget));$('#dialogClose').addEventListener('click',closeDialog);$('#dialogCancel').addEventListener('click',closeDialog);$('#feedbackDialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog();});$('#dialogConfirm').addEventListener('click',()=>{const publish=dialogMode==='publish';closeDialog();if(publish)toast('设计预览：已演示确认操作，未发布任何活动。');});
$('#previewKit').addEventListener('click',()=>{clearTimeout(toastTimer);$('#toast').hidden=true;$('#kitDialog').showModal();$('#kitClose').focus();});$('#kitClose').addEventListener('click',closeKit);$('#kitDialog').addEventListener('cancel',e=>{e.preventDefault();closeKit();});$('#kitPrimary').addEventListener('click',()=>toast('设计预览：主按钮交互示例。'));$('#kitSecondary').addEventListener('click',()=>toast('设计预览：次按钮交互示例。'));$('#kitClear').addEventListener('click',()=>{$('#kitInput').value='';toast('设计预览：已清空组件示例中的输入。');});
$('#menuToggle').addEventListener('click',()=>setMenu(true));$('#drawerShade').addEventListener('click',()=>setMenu(false));document.addEventListener('keydown',e=>{if(!$('#sidebar').classList.contains('open'))return;if(e.key==='Escape')setMenu(false);if(e.key==='Tab'){const items=[...$('#sidebar').querySelectorAll('a,button')];const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.addEventListener('click',e=>{if(!$('#previewTools').contains(e.target)&&!e.target.closest('dialog'))$('#previewTools').open=false;});
</script>
</body>
</html>
