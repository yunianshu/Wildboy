# Standalone Linux host-network listener. The existing API binds to loopback.
ssl_protocols TLSv1.2 TLSv1.3;
log_format wildboy_api_https '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 421;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.wildboy.com.cn;
    server_tokens off;
    ssl_certificate /etc/nginx/tls/api.wildboy.com.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/api.wildboy.com.cn/privkey.pem;
    client_max_body_size 6m;
    access_log /var/log/nginx/access.log wildboy_api_https;

    if ($host != api.wildboy.com.cn) {
        return 421;
    }

    # The direct public endpoint never exposes the development login.
    location ~ ^/api/v1/auth/dev-login(?:/|$) {
        return 404;
    }

    # Includes all four WeChat Pay POST callbacks. Forward method, request
    # body, Wechatpay-* headers and the original path/query to Spring.
    location ~ ^/(?:api/v1(?:/|$)|assets/) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-AnyService-Authorization "";
    }

    location / {
        return 404;
    }
}
