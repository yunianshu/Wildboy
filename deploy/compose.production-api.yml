# Add to docker-compose.yml when configuring the existing API for WeChat Pay.
services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_FLYWAY_OUT_OF_ORDER: ${SPRING_FLYWAY_OUT_OF_ORDER:-false}
      WECHAT_PAY_NOTIFY_URL: https://api.wildboy.com.cn/api/v1/payments/wechat/notify
      WECHAT_PAY_PRIVATE_KEY_PATH: /run/secrets/apiclient_key.pem
      WECHAT_PAY_PUBLIC_KEY_PATH: /run/secrets/wechatpay_public_key.pem
    volumes:
      - type: bind
        source: ${WILDBOY_WECHAT_PAY_KEY_DIR:-/etc/wildboy/wechat-pay}/apiclient_key.pem
        target: /run/secrets/apiclient_key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WILDBOY_WECHAT_PAY_KEY_DIR:-/etc/wildboy/wechat-pay}/wechatpay_public_key.pem
        target: /run/secrets/wechatpay_public_key.pem
        read_only: true
        bind:
          create_host_path: false
