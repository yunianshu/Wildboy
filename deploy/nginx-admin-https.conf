server {
    listen 443 ssl;
    server_name www.wildboy.com.cn;
    server_tokens off;
    ssl_certificate /etc/nginx/tls/www.wildboy.com.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/www.wildboy.com.cn/privkey.pem;
    client_max_body_size 6m;
    access_log /var/log/nginx/access.log wildboy_api_https;

    if ($host != www.wildboy.com.cn) {
        return 421;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-AnyService-Authorization "";

    location ~ ^/api/v1/auth/dev-login(?:/|$) {
        return 404;
    }

    location ~ ^/api/v1(?:/|$) {
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/ {
        return 404;
    }

    location = /health {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
