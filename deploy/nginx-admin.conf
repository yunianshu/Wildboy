# Wildboy admin console (Vue SPA) + API reverse proxy.
# Transitional setup: listens publicly on 8081 over plain HTTP because no
# filed domain/certificate exists yet. Restrict back to 127.0.0.1 (and use an
# SSH tunnel) once the admin entry should no longer be internet-reachable.
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # The SPA bundle and the backend cover images share the /assets/ prefix:
    # serve the file from the admin build when it exists, otherwise fall back
    # to the API (cover images live under the backend's classpath static dir).
    location /assets/ {
        try_files $uri @api_assets;
    }
    location @api_assets {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
