services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wildboy
      POSTGRES_USER: wildboy
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - wildboy-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U wildboy -d wildboy']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./server
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/wildboy
      DATABASE_USER: wildboy
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      # Deployment choice via .env: "dev" enables the demo login and demo
      # data (trial phase); unset/empty keeps production behaviour.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      # The API is only reachable through the loopback reverse proxy that
      # fronts AnyService, so its client address header can be trusted for
      # per-client login rate limiting.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # Browsers always send Origin on POST; without the admin origin in the
      # whitelist Spring's CORS filter rejects logins with 403.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TENCENT_MAP_KEY: ${TENCENT_MAP_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set a BCrypt admin password hash}
      IDENTITY_ENCRYPTION_KEY: ${IDENTITY_ENCRYPTION_KEY:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      # 小程序「消息推送」接收端点（/api/v1/wechat/messages，mp 后台安全模式配套）
      WECHAT_PUSH_TOKEN: ${WECHAT_PUSH_TOKEN:-}
      WECHAT_PUSH_AES_KEY: ${WECHAT_PUSH_AES_KEY:-}
      WECHAT_PAY_MERCHANT_ID: ${WECHAT_PAY_MERCHANT_ID:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_MERCHANT_SERIAL_NUMBER: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:-}
      WECHAT_PAY_PUBLIC_KEY_PATH: ${WECHAT_PAY_PUBLIC_KEY_PATH:-}
      WECHAT_PAY_PUBLIC_KEY_ID: ${WECHAT_PAY_PUBLIC_KEY_ID:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      # Spring 绑定 wildboy.media-dir（@Value relaxed binding 需要 WILDBOY_ 前缀）
      WILDBOY_MEDIA_DIR: /app/data/uploads
      WECHAT_NOTIFICATIONS_ENABLED: ${WECHAT_NOTIFICATIONS_ENABLED:-false}
      # 微信「发货信息管理」上报（交易类小程序合规），生产开启
      WILDBOY_SHIPPING_ENABLED: ${WILDBOY_SHIPPING_ENABLED:-false}
      WECHAT_NOTIFICATION_TEMPLATE_ID: ${WECHAT_NOTIFICATION_TEMPLATE_ID:-}
      WECHAT_NOTIFICATION_TITLE_KEY: ${WECHAT_NOTIFICATION_TITLE_KEY:-thing1}
      WECHAT_NOTIFICATION_TIME_KEY: ${WECHAT_NOTIFICATION_TIME_KEY:-time2}
      WECHAT_NOTIFICATION_DETAIL_KEY: ${WECHAT_NOTIFICATION_DETAIL_KEY:-thing3}
      WECHAT_NOTIFICATION_STATE: ${WECHAT_NOTIFICATION_STATE:-formal}
    volumes:
      - wildboy-media:/app/data/uploads
      # 微信支付商户密钥：宿主机 /etc/wildboy/wechat-pay/（可由 WILDBOY_WECHAT_PAY_KEY_DIR 覆盖）
      # 只读挂载为 /run/secrets/*，路径与 .env 的 WECHAT_PAY_*_PATH 对应；
      # create_host_path=false 确保密钥缺失时 compose 启动失败而不是挂出空目录。
      - type: bind
        source: ${WILDBOY_WECHAT_PAY_KEY_DIR:-/etc/wildboy/wechat-pay}/apiclient_key.pem
        target: /run/secrets/apiclient_key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WILDBOY_WECHAT_PAY_KEY_DIR:-/etc/wildboy/wechat-pay}/wechatpay_public_key.pem
        target: /run/secrets/wechatpay_public_key.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  wildboy-data:
  wildboy-media:
