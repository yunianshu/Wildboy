server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wildboy}
    username: ${DATABASE_USER:wildboy}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
  mvc:
    problemdetails:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
wildboy:
  media-dir: ${MEDIA_DIR:./data/uploads}
  notifications:
    enabled: ${WECHAT_NOTIFICATIONS_ENABLED:false}
    template-id: ${WECHAT_NOTIFICATION_TEMPLATE_ID:}
    title-key: ${WECHAT_NOTIFICATION_TITLE_KEY:thing1}
    time-key: ${WECHAT_NOTIFICATION_TIME_KEY:time2}
    detail-key: ${WECHAT_NOTIFICATION_DETAIL_KEY:thing3}
    state: ${WECHAT_NOTIFICATION_STATE:formal}
  identity:
    encryption-key: ${IDENTITY_ENCRYPTION_KEY:}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    # 消息推送服务（发货信息管理事件）：mp 后台「消息推送」配置的 Token 与
    # EncodingAESKey（安全模式必填）。留空时 /api/v1/wechat/messages 拒绝接收。
    push-token: ${WECHAT_PUSH_TOKEN:}
    push-aes-key: ${WECHAT_PUSH_AES_KEY:}
  shipping:
    # 微信「发货信息管理」上报开关：交易类小程序合规要求，生产开启
    enabled: ${WILDBOY_SHIPPING_ENABLED:false}
  admin:
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  dev-login-enabled: false
  demo-data: false
  pay:
    merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
    public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
    public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
