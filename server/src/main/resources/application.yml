server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wildboy}
    username: ${DATABASE_USER:wildboy}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
wildboy:
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  admin:
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  dev-login-enabled: false
  demo-data: false
